# 홈서버는 이 파일 하나만 있으면 된다. `docker compose up -d`
# 소스에서 직접 빌드하려면 docker-compose.build.yaml 을 겹쳐 쓴다.
services:
  studywatch:
    image: ghcr.io/junbeom-cho/studywatch:latest
    container_name: studywatch
    restart: unless-stopped
    # up 할 때마다 새 latest 를 확인한다
    pull_policy: always
    ports:
      # Tailscale 로 붙으므로 공개 인터넷에 열지 않는다 (PRD NG-2)
      - '${PORT:-3000}:3000'
    environment:
      # 학습일이 이 타임존 기준으로 정해진다
      TZ: ${TZ:-Asia/Seoul}
      DATA_DIR: /data
    volumes:
      # 바인드 마운트라 백업이 data/studywatch.db 복사 한 번으로 끝난다
      - ${DATA_DIR:-.}/data:/data
